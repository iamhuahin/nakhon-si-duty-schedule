
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>ตารางกำหนดการปฏิบัติงาน กอ.รมน.จังหวัด น.ศ.</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --peach:#F4BA94;
  --navy:#102E59;
  --yellow:#FFEB00;
  --green:#D9EAD3;
  --attire-blue:#003366;
  --border:#333333;
}
* { box-sizing:border-box; }

body {
  margin:0;
  padding:12px;
  background:var(--peach);
  color:#171717;
  font-family:"Sarabun",Tahoma,sans-serif;
}
button,input,textarea { font:inherit; }
button {
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
}
button:disabled { opacity:.6;cursor:wait; }
.primary { background:var(--navy);color:white;border:1px solid var(--navy); }
.secondary { background:white;color:var(--navy);border:1px solid var(--navy); }
.danger { background:#A91F2C;color:white;border:1px solid #A91F2C; }
.small { padding:6px 9px;font-size:14px; }
input,textarea {
  width:100%;
  padding:9px;
  border:1px solid #888;
  border-radius:6px;
}
#datePicker { width:auto; }
.page { width:100%;margin:auto; }
.toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin-bottom:10px;
}
.status { margin:8px 0;font-weight:700; }
.status.ok { color:#17612E; }
.status.error { color:#A91F2C; }

/* พื้นหลังและกรอบภาพ */
.sheet {
  width:100%;
  padding:10px;
  background:var(--peach);
}

/* คงขนาดโลโก้และความสูงแถบสีน้ำเงินเดิม */
.header-layout {
  display:grid;
  grid-template-columns:175px minmax(0,1fr);
  gap:16px;
  align-items:stretch;
  margin-bottom:16px;
}
.logo-area {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  background:var(--peach);
}
.logo {
  display:block;
  width:175px;
  height:175px;
  object-fit:contain;
}
.logo-placeholder {
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #805f4b;
  color:#805f4b;
  text-align:center;
  font-size:14px;
  padding:8px;
}
.header-band {
  min-width:0;
  height:175px;
  background:var(--navy);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:10px 16px;
}
.heading {
  color:var(--yellow);
  text-align:center;
  font-size:46px;
  font-weight:800;
  line-height:1.2;
  margin:0 0 8px;
}
.date-line {
  color:white;
  text-align:center;
  font-size:32px;
  font-weight:700;
  line-height:1.25;
  margin:0;
}

/* ตาราง */
.table-wrap { width:100%;overflow-x:auto; }
table {
  width:100%;
  min-width:980px;
  table-layout:fixed;
  border-collapse:collapse;
  background:white;
}
th,td {
  border:1px solid var(--border);
  padding:10px 12px;
  line-height:1.45;
  overflow-wrap:anywhere;
  font-weight:700;
  vertical-align:middle;
}
th {
  background:var(--green);
  text-align:center;
  font-size:24px;
  font-weight:800;
}
td { font-size:23px; }

/* ปรับคอลัมน์เวลาให้แคบลง */
th:nth-child(1) { width:8%; }
th:nth-child(2) { width:30%; }
th:nth-child(3) { width:14%; }
th:nth-child(4) { width:16%; }
th:nth-child(5) { width:15%; }
th:nth-child(6) { width:17%; }

td.time {
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
}
tbody td:nth-child(3),
tbody td:nth-child(4),
tbody td:nth-child(5),
tbody td:nth-child(6) {
  text-align:center;
  vertical-align:middle;
}

/* รายละเอียดภารกิจชิดซ้ายและกึ่งกลางแนวตั้ง */
td.mission-cell {
  text-align:left;
  vertical-align:middle;
  padding-left:14px;
  padding-right:12px;
}
.mission {
  font-size:25px;
  font-weight:800;
  text-align:left;
  white-space:pre-wrap;
  line-height:1.4;
}
.attire {
  margin-top:6px;
  color:var(--attire-blue);
  font-size:22px;
  font-weight:800;
  text-align:left;
  text-decoration:underline;
  white-space:pre-wrap;
  line-height:1.4;
}
.operators {
  white-space:pre-line;
  text-align:center;
}
.empty {
  text-align:center;
  padding:24px;
  color:#555;
  font-size:22px;
}
.hidden { display:none !important; }

/* หน้าต่างเพิ่มและจัดการภารกิจ */
.backdrop {
  position:fixed;
  inset:0;
  z-index:10;
  padding:14px;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal {
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:12px;
  padding:20px;
}
.modal h2 { margin-top:0;color:var(--navy); }
.formgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.field { display:flex;flex-direction:column;gap:6px; }
.field label { font-weight:700; }
.full { grid-column:1/-1; }
textarea { min-height:70px;resize:vertical; }
.actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}
.manage-list { display:grid;gap:9px; }
.manage-item {
  display:flex;
  justify-content:space-between;
  gap:12px;
  border:1px solid #ccc;
  border-radius:8px;
  padding:12px;
}
.manage-text {
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}
.meta { font-size:15px;color:#555;margin-top:4px; }
.manage-actions { display:flex;gap:6px;align-items:flex-start; }

@media(max-width:900px) {
  .heading { font-size:clamp(25px,4vw,38px); }
  .date-line { font-size:clamp(19px,3vw,27px); }
  .header-layout { grid-template-columns:140px minmax(0,1fr); }
  .logo { width:140px;height:140px; }
  .header-band { height:175px; }
  th { font-size:21px; }
  td { font-size:20px; }
  .mission { font-size:22px; }
  .attire { font-size:20px; }
}

@media(max-width:650px) {
  body { padding:6px; }
  .sheet { padding:5px; }
  .header-layout {
    grid-template-columns:76px minmax(0,1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .logo { width:72px;height:72px; }
  .logo-placeholder {
    width:70px;height:70px;font-size:10px;
  }
  .header-band {
    height:120px;
    padding:8px 5px;
  }
  .heading { font-size:17px;margin-bottom:5px; }
  .date-line { font-size:13px; }
  .formgrid { grid-template-columns:1fr; }
  .full { grid-column:auto; }
  .manage-item { flex-direction:column; }
}

@media print {
  body { padding:0; }
  .toolbar,.status,.no-print { display:none !important; }
  .sheet { padding:0; }
  .table-wrap { overflow:visible; }
  table { min-width:0; }
}
</style>
</head>

<body>
<main class="page">

  <div class="toolbar no-print">
    <label for="datePicker">เลือกวันที่:</label>
    <input id="datePicker" type="date">
    <button class="primary" onclick="openForm()">+ เพิ่มภารกิจ</button>
    <button class="secondary" onclick="openManager()">จัดการภารกิจ</button>
    <button class="secondary" onclick="load()">🔄 โหลดข้อมูลใหม่</button>
    <button class="secondary" onclick="exportPng()">ส่งออกภาพ PNG</button>
    <button class="secondary" onclick="window.print()">พิมพ์</button>
  </div>

  <div id="status" class="status" role="status"></div>

  <section id="exportArea" class="sheet">
    <div class="header-layout">
      <div class="logo-area">
        <img id="logo" class="logo" alt="ตราสัญลักษณ์หน่วยงาน">
        <div id="logoPlaceholder" class="logo-placeholder hidden">
          ไม่สามารถโหลดโลโก้ได้
        </div>
      </div>

      <div class="header-band">
        <h1 class="heading">ตารางกำหนดการปฏิบัติงาน กอ.รมน.จังหวัด น.ศ.</h1>
        <p id="dateLine" class="date-line"></p>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>เวลา</th>
            <th>ภารกิจ</th>
            <th>ประธาน</th>
            <th>สถานที่</th>
            <th>หน่วยรับผิดชอบ</th>
            <th>ผู้ปฏิบัติ</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="empty">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div id="formModal" class="backdrop hidden">
  <section class="modal" role="dialog" aria-modal="true">
    <h2 id="formTitle">เพิ่มภารกิจ</h2>
    <form id="itemForm">
      <div class="formgrid">
        <div class="field">
          <label for="date">วันที่ *</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="time">เวลา (4 หลัก เช่น 0830)</label>
          <input id="time" maxlength="4" inputmode="numeric" placeholder="0830">
        </div>
        <div class="field full">
          <label for="mission">ภารกิจ *</label>
          <textarea id="mission" required></textarea>
        </div>
        <div class="field full">
          <label for="attire">การแต่งกาย</label>
          <input id="attire">
        </div>
        <div class="field">
          <label for="chair">ประธาน</label>
          <textarea id="chair"></textarea>
        </div>
        <div class="field">
          <label for="location">สถานที่</label>
          <textarea id="location"></textarea>
        </div>
        <div class="field">
          <label for="unit">หน่วยรับผิดชอบ</label>
          <textarea id="unit"></textarea>
        </div>
        <div class="field">
          <label for="operators">ผู้ปฏิบัติ (คนละบรรทัด)</label>
          <textarea id="operators"></textarea>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="closeForm()">ยกเลิก</button>
        <button id="saveBtn" class="primary" type="submit">บันทึก</button>
      </div>
    </form>
  </section>
</div>

<div id="managerModal" class="backdrop hidden">
  <section class="modal" role="dialog" aria-modal="true">
    <h2>จัดการภารกิจของวันที่เลือก</h2>
    <div id="managerList" class="manage-list"></div>
    <div class="actions">
      <button class="secondary" onclick="closeManager()">ปิด</button>
      <button class="primary" onclick="openForm()">+ เพิ่มภารกิจ</button>
    </div>
  </section>
</div>

<script>
let items = [];
let editing = null;
const $ = id => document.getElementById(id);

const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbdy1XUtoWjojOpommUSE5CNOr9XwYraN-dwKZkkZKAvBouHsamXLC1QS8CaB4G29Mkr/exec';

function apiCall(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName = '__scheduleApiCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const query = new URLSearchParams({ action, callback: callbackName, ...params });
    let finished = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ กรุณาตรวจสอบ URL และการ Deploy'));
    }, 25000);

    window[callbackName] = result => {
      cleanup();
      if (result && result.success === false) reject(new Error(result.message || 'เกิดข้อผิดพลาด'));
      else resolve(result);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('เรียก API ไม่สำเร็จ กรุณาตรวจสอบการเผยแพร่ Apps Script'));
    };
    script.src = APPS_SCRIPT_API_URL + '?' + query.toString();
    document.head.appendChild(script);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  $('datePicker').addEventListener('change', render);
  $('itemForm').addEventListener('submit', save);

  $('logo').addEventListener('error', () => {
    $('logo').classList.add('hidden');
    $('logoPlaceholder').classList.remove('hidden');
  });

  load();
});

function status(message, type = '') {
  $('status').textContent = message;
  $('status').className = 'status ' + type;
}

function load() {
  status('กำลังโหลดข้อมูลจาก Google Sheets...');

  apiCall('getAppData')
    .then(data => {
      items = data.items || [];

      if (data.logoDataUrl) {
        $('logo').classList.remove('hidden');
        $('logoPlaceholder').classList.add('hidden');
        $('logo').src = data.logoDataUrl;
      } else {
        $('logo').classList.add('hidden');
        $('logoPlaceholder').classList.remove('hidden');
        if (data.logoError) console.error('Logo error:', data.logoError);
      }

      const previousDate = $('datePicker').value;
      const availableDates = items.map(x => x.date);

      $('datePicker').value =
        previousDate && availableDates.includes(previousDate)
          ? previousDate
          : (data.latestDate || today());

      render();

      if (!$('managerModal').classList.contains('hidden')) {
        renderManager();
      }

      status('โหลดข้อมูลจาก Google Sheets เรียบร้อย', 'ok');
    })
    .catch(error => {
      status('โหลดข้อมูลไม่สำเร็จ: ' + msg(error), 'error');
      $('tbody').innerHTML = '<tr><td colspan="6" class="empty">โหลดข้อมูลไม่สำเร็จ กรุณากดโหลดข้อมูลใหม่</td></tr>';
    });
}

function render() {
  const date = $('datePicker').value;
  $('dateLine').textContent = date ? thaiDate(date) : 'ยังไม่ได้เลือกวันที่';

  const rows = items
    .filter(x => x.date === date)
    .sort((a, b) =>
      (a.time || '9999').localeCompare(b.time || '9999') ||
      a.rowNumber - b.rowNumber
    );

  const tbody = $('tbody');
  tbody.replaceChildren();

  if (!rows.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty';
    td.textContent = 'ไม่มีภารกิจในวันที่เลือก';
    tr.append(td);
    tbody.append(tr);
    return;
  }

  rows.forEach(x => {
    const tr = document.createElement('tr');

    cell(tr, x.time ? digits(x.time) : '-', 'time');

    const missionCell = document.createElement('td');
    missionCell.className = 'mission-cell';

    const mission = document.createElement('div');
    mission.className = 'mission';
    mission.textContent = x.mission || '-';
    missionCell.append(mission);

    if (x.attire) {
      const attire = document.createElement('div');
      attire.className = 'attire';
      attire.textContent = 'การแต่งกาย: ' + x.attire;
      missionCell.append(attire);
    }

    tr.append(missionCell);
    cell(tr, x.chair || '-');
    cell(tr, x.location || '-');
    cell(tr, x.unit || '-');
    cell(tr, x.operators || '-', 'operators');
    tbody.append(tr);
  });
}

function cell(tr, value, className = '') {
  const td = document.createElement('td');
  td.textContent = value || '-';
  if (className) td.className = className;
  tr.append(td);
}

function openForm(item = null) {
  editing = item ? JSON.parse(JSON.stringify(item)) : null;

  $('formTitle').textContent = editing ? 'แก้ไขภารกิจ' : 'เพิ่มภารกิจ';
  $('saveBtn').textContent = editing ? 'บันทึกการแก้ไข' : 'บันทึก';
  $('date').value = editing ? editing.date : ($('datePicker').value || today());

  ['time','mission','attire','chair','location','unit','operators'].forEach(key => {
    $(key).value = editing ? (editing[key] || '') : '';
  });

  $('managerModal').classList.add('hidden');
  $('formModal').classList.remove('hidden');
}

function closeForm() {
  $('formModal').classList.add('hidden');
  editing = null;
}

function closeManager() {
  $('managerModal').classList.add('hidden');
}

function snapshot(x) {
  return {
    date:x.date, time:x.time, mission:x.mission,
    chair:x.chair, location:x.location, unit:x.unit,
    operators:x.operators, attire:x.attire
  };
}

function save(event) {
  event.preventDefault();

  const time = $('time').value.trim();
  if (time && !/^\d{4}$/.test(time)) {
    alert('กรุณากรอกเวลาเป็นตัวเลข 4 หลัก เช่น 0830');
    return;
  }

  const item = {
    date:$('date').value,
    time,
    mission:$('mission').value.trim(),
    attire:$('attire').value.trim(),
    chair:$('chair').value.trim(),
    location:$('location').value.trim(),
    unit:$('unit').value.trim(),
    operators:$('operators').value.trim()
  };

  if (!item.date || !item.mission) {
    alert('กรุณากรอกวันที่และภารกิจ');
    return;
  }

  if (!confirm(editing
    ? 'ยืนยันแก้ไขภารกิจนี้ใช่หรือไม่?'
    : 'ยืนยันเพิ่มภารกิจนี้ใช่หรือไม่?')) return;

  if (editing) {
    item.rowNumber = editing.rowNumber;
    item.expected = snapshot(editing);
  }

  $('saveBtn').disabled = true;

  apiCall('saveScheduleItem', { item: JSON.stringify(item) })
    .then(result => {
      $('saveBtn').disabled = false;
      closeForm();
      $('datePicker').value = item.date;
      status(result.message || 'บันทึกเรียบร้อย', 'ok');
      load();
    })
    .catch(error => {
      $('saveBtn').disabled = false;
      alert('บันทึกไม่สำเร็จ: ' + msg(error));
    });
}

function openManager() {
  $('formModal').classList.add('hidden');
  $('managerModal').classList.remove('hidden');
  renderManager();
}

function renderManager() {
  const list = $('managerList');
  list.replaceChildren();

  const rows = items
    .filter(x => x.date === $('datePicker').value)
    .sort((a, b) =>
      (a.time || '9999').localeCompare(b.time || '9999') ||
      a.rowNumber - b.rowNumber
    );

  if (!rows.length) {
    const p = document.createElement('p');
    p.textContent = 'ไม่มีภารกิจในวันที่เลือก';
    list.append(p);
    return;
  }

  rows.forEach(x => {
    const card = document.createElement('div');
    card.className = 'manage-item';

    const info = document.createElement('div');
    info.className = 'manage-text';

    const title = document.createElement('b');
    title.textContent =
      (x.time ? digits(x.time) + ' — ' : '') + (x.mission || '(ไม่มีชื่อภารกิจ)');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'ประธาน: ' + (x.chair || '-') +
      ' | สถานที่: ' + (x.location || '-');

    info.append(title, meta);

    const actions = document.createElement('div');
    actions.className = 'manage-actions';

    const editButton = document.createElement('button');
    editButton.className = 'secondary small';
    editButton.textContent = 'แก้ไข';
    editButton.onclick = () => openForm(x);

    const deleteButton = document.createElement('button');
    deleteButton.className = 'danger small';
    deleteButton.textContent = 'ลบ';
    deleteButton.onclick = () => removeItem(x);

    actions.append(editButton, deleteButton);
    card.append(info, actions);
    list.append(card);
  });
}

function removeItem(item) {
  if (!confirm(
    'ยืนยันลบภารกิจนี้ใช่หรือไม่?\n\n' +
    item.mission + '\n\nการลบไม่สามารถย้อนกลับได้'
  )) return;

  apiCall('deleteScheduleItem', {
    rowNumber: String(item.rowNumber),
    expected: JSON.stringify(snapshot(item))
  })
    .then(result => {
      status(result.message || 'ลบเรียบร้อย', 'ok');
      load();
    })
    .catch(error => {
      alert('ลบไม่สำเร็จ: ' + msg(error));
      load();
    });
}

async function exportPng() {
  if (!window.html2canvas) {
    alert('โหลดเครื่องมือส่งออกภาพไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');
    return;
  }

  status('กำลังสร้างภาพ PNG...');

  try {
    const logo = $('logo');

    /* รอให้โลโก้โหลดและถอดรหัสภาพก่อนสร้าง PNG */
    if (!logo.classList.contains('hidden') && logo.src) {
      if (!logo.complete) {
        await new Promise((resolve, reject) => {
          logo.onload = resolve;
          logo.onerror = reject;
        });
      }
      if (logo.decode) await logo.decode();
      if (!logo.naturalWidth) {
        throw new Error('ไม่พบไฟล์โลโก้ที่โหลดได้ กรุณากดโหลดข้อมูลใหม่');
      }
    } else {
      throw new Error('ไม่พบโลโก้บนหน้าเว็บ กรุณากดโหลดข้อมูลใหม่');
    }

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const canvas = await html2canvas($('exportArea'), {
      scale:2,
      backgroundColor:'#F4BA94',
      useCORS:true,
      allowTaint:false,
      imageTimeout:15000,
      scrollX:0,
      scrollY:0,
      logging:false
    });

    const link = document.createElement('a');
    link.download = 'ตารางกำหนดการ-' +
      ($('datePicker').value || 'schedule') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    status('ส่งออกภาพ PNG เรียบร้อย', 'ok');
  } catch (error) {
    status('ส่งออกภาพไม่สำเร็จ: ' + msg(error), 'error');
  }
}

function thaiDate(iso) {
  const parts = iso.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);

  const weekdays = [
    'อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'
  ];
  const months = [
    'มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'
  ];

  return 'ประจำวัน' + weekdays[d.getDay()] +
    ' ที่ ' + digits(d.getDate()) +
    ' ' + months[d.getMonth()] +
    ' พ.ศ. ' + digits(d.getFullYear() + 543);
}

function digits(value) {
  return String(value).replace(/[0-9]/g, n => '๐๑๒๓๔๕๖๗๘๙'[Number(n)]);
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function msg(error) {
  return error && error.message ? error.message : String(error || 'เกิดข้อผิดพลาด');
}
