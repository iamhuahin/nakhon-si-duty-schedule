<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<title>ตารางกำหนดการปฏิบัติงาน กอ.รมน.จังหวัด น.ศ.</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--peach:#F4BA94;--navy:#102E59;--blue:#0756A6}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--peach);font-family:Tahoma,"Noto Sans Thai",sans-serif;color:#171717}.page{max-width:1500px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:12px}button,input,textarea{font:inherit}button{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:bold}.primary{background:var(--navy);color:white}.secondary{background:white;color:var(--navy);border:1px solid var(--navy)}.danger{background:#a91f2c;color:white}.small{padding:6px 9px;font-size:13px}input,textarea{padding:9px;border:1px solid #888;border-radius:6px;width:100%}#datePicker{width:auto}.sheet{background:#fffdf9;padding:16px;box-shadow:0 3px 12px #0002}.heading-row{display:flex;align-items:center;gap:14px}.logo{width:84px;height:84px;object-fit:contain;flex:0 0 84px}.heading{flex:1;text-align:center;background:var(--navy);color:#ffeb00;font-weight:800;font-size:clamp(18px,2.5vw,30px);padding:14px 8px;line-height:1.5}.date-line{text-align:center;font-weight:bold;font-size:clamp(16px,2vw,22px);margin:12px 0 16px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed;background:white}th,td{border:1px solid #333;padding:9px;vertical-align:top;line-height:1.55;overflow-wrap:anywhere}th{text-align:center;vertical-align:middle;background:#e8e8e8}td{font-size:15px}th:nth-child(1){width:10%}th:nth-child(2){width:27%}th:nth-child(3){width:14%}th:nth-child(4){width:16%}th:nth-child(5){width:15%}th:nth-child(6){width:18%}.time{text-align:center;white-space:nowrap}.mission{font-weight:bold;white-space:pre-wrap}.attire{margin-top:5px;color:var(--blue);font-weight:bold;text-decoration:underline;white-space:pre-wrap}.operators{white-space:pre-line}.empty{text-align:center;padding:24px;color:#555}.status{margin:8px 0;font-weight:bold}.error{color:#a91f2c}.ok{color:#165b2d}.backdrop{position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}.hidden{display:none!important}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:white;border-radius:12px;padding:20px}.modal h2{margin-top:0;color:var(--navy)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:bold}.full{grid-column:1/-1}textarea{min-height:70px;resize:vertical}.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:16px}.manage-list{display:grid;gap:9px}.manage-item{display:flex;justify-content:space-between;gap:12px;border:1px solid #ccc;border-radius:8px;padding:12px}.manage-text{flex:1;min-width:0;overflow-wrap:anywhere}.meta{font-size:13px;color:#555;margin-top:4px}.manage-actions{display:flex;gap:6px;align-items:start}@media(max-width:650px){body{padding:8px}.sheet{padding:8px}.heading-row{gap:7px}.logo{width:56px;height:56px;flex-basis:56px}.heading{font-size:16px;padding:8px 5px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.manage-item{flex-direction:column}}@media print{body{padding:0;background:white}.toolbar,.status,.no-print{display:none!important}.sheet{box-shadow:none;padding:0}.table-wrap{overflow:visible}table{min-width:0}}
</style>
</head>
<body><main class="page">
<div class="toolbar no-print"><label for="datePicker">เลือกวันที่:</label><input id="datePicker" type="date"><button class="primary" onclick="openForm()">+ เพิ่มภารกิจ</button><button class="secondary" onclick="openManager()">จัดการภารกิจ</button><button class="secondary" onclick="exportPng()">ส่งออก PNG</button><button class="secondary" onclick="print()">พิมพ์</button></div>
<div id="status" class="status" role="status"></div>
<section id="exportArea" class="sheet"><div class="heading-row"><img id="logo" class="logo" alt="ตราสัญลักษณ์"><div class="heading">ตารางกำหนดการปฏิบัติงาน กอ.รมน.จังหวัด น.ศ.</div></div><div id="dateLine" class="date-line"></div>
<div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ภารกิจ</th><th>ประธาน</th><th>สถานที่</th><th>หน่วยรับผิดชอบ</th><th>ผู้ปฏิบัติ</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="empty">กำลังโหลดข้อมูล...</td></tr></tbody></table></div></section></main>
<div id="formModal" class="backdrop hidden"><section class="modal" role="dialog" aria-modal="true"><h2 id="formTitle">เพิ่มภารกิจ</h2><form id="itemForm"><div class="formgrid">
<div class="field"><label for="date">วันที่ *</label><input id="date" type="date" required></div><div class="field"><label for="time">เวลา (4 หลัก เช่น 0830)</label><input id="time" maxlength="4" inputmode="numeric" placeholder="0830"></div>
<div class="field full"><label for="mission">ภารกิจ *</label><textarea id="mission" required></textarea></div><div class="field full"><label for="attire">การแต่งกาย</label><input id="attire" type="text"></div>
<div class="field"><label for="chair">ประธาน</label><textarea id="chair"></textarea></div><div class="field"><label for="location">สถานที่</label><textarea id="location"></textarea></div><div class="field"><label for="unit">หน่วยรับผิดชอบ</label><textarea id="unit"></textarea></div><div class="field"><label for="operators">ผู้ปฏิบัติ (คนละบรรทัด)</label><textarea id="operators"></textarea></div></div><div class="actions"><button type="button" class="secondary" onclick="closeForm()">ยกเลิก</button><button id="saveBtn" class="primary" type="submit">บันทึก</button></div></form></section></div>
<div id="managerModal" class="backdrop hidden"><section class="modal" role="dialog" aria-modal="true"><h2>จัดการภารกิจของวันที่เลือก</h2><div id="managerList" class="manage-list"></div><div class="actions"><button class="secondary" onclick="closeManager()">ปิด</button><button class="primary" onclick="openForm()">+ เพิ่มภารกิจ</button></div></section></div>
<script>
let items=[],editing=null;const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',()=>{$('datePicker').addEventListener('change',render);$('itemForm').addEventListener('submit',save);$('logo').src='https://drive.google.com/uc?export=view&id=1RYqjqw5bW-nqpgvcMn3Cdhly5QTwnJyK';$('logo').onerror=()=>{$('logo').style.display='none'};load()});
function status(s,c=''){$('status').textContent=s;$('status').className='status '+c}
function load(){status('กำลังโหลดข้อมูล...');google.script.run.withSuccessHandler(d=>{items=d.items||[];$('datePicker').value=d.latestDate||today();render();status('โหลดข้อมูลเรียบร้อย','ok')}).withFailureHandler(e=>{status('โหลดข้อมูลไม่สำเร็จ: '+msg(e),'error');$('tbody').innerHTML='<tr><td colspan="6" class="empty">ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบสิทธิ์และชื่อแท็บ Sheet1</td></tr>'}).getAppData()}
function render(){const date=$('datePicker').value;$('dateLine').textContent=date?thaiDate(date):'ยังไม่ได้เลือกวันที่';const rows=items.filter(x=>x.date===date).sort((a,b)=>(a.time||'9999').localeCompare(b.time||'9999')||a.rowNumber-b.rowNumber);const tb=$('tbody');tb.replaceChildren();if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='ไม่มีภารกิจในวันที่เลือก';tr.append(td);tb.append(tr);return}rows.forEach(x=>{const tr=document.createElement('tr');cell(tr,x.time?digits(x.time.slice(0,2)+':'+x.time.slice(2,4)):'-','time');const td=document.createElement('td'),m=document.createElement('div');m.className='mission';m.textContent=x.mission||'-';td.append(m);if(x.attire){const a=document.createElement('div');a.className='attire';a.textContent='การแต่งกาย: '+x.attire;td.append(a)}tr.append(td);cell(tr,x.chair||'-');cell(tr,x.location||'-');cell(tr,x.unit||'-');cell(tr,x.operators||'-','operators');tb.append(tr)})}
function cell(tr,v,c=''){const td=document.createElement('td');td.textContent=v||'-';if(c)td.className=c;tr.append(td)}
function openForm(x=null){editing=x?JSON.parse(JSON.stringify(x)):null;$('formTitle').textContent=editing?'แก้ไขภารกิจ':'เพิ่มภารกิจ';$('saveBtn').textContent=editing?'บันทึกการแก้ไข':'บันทึก';$('date').value=editing?editing.date:($('datePicker').value||today());['time','mission','attire','chair','location','unit','operators'].forEach(k=>$(k).value=editing?(editing[k]||''):'');$('managerModal').classList.add('hidden');$('formModal').classList.remove('hidden')}
function closeForm(){$('formModal').classList.add('hidden');editing=null}
function snapshot(x){return{date:x.date,time:x.time,mission:x.mission,chair:x.chair,location:x.location,unit:x.unit,operators:x.operators,attire:x.attire}}
function save(e){e.preventDefault();const time=$('time').value.trim();if(time&&!/^\d{4}$/.test(time)){alert('กรุณากรอกเวลาเป็นตัวเลข 4 หลัก เช่น 0830');return}const x={date:$('date').value,time,mission:$('mission').value.trim(),attire:$('attire').value.trim(),chair:$('chair').value.trim(),location:$('location').value.trim(),unit:$('unit').value.trim(),operators:$('operators').value.trim()};if(!x.date||!x.mission){alert('กรุณากรอกวันที่และภารกิจ');return}if(!confirm(editing?'ยืนยันแก้ไขภารกิจนี้ใช่หรือไม่?':'ยืนยันเพิ่มภารกิจนี้ใช่หรือไม่?'))return;if(editing){x.rowNumber=editing.rowNumber;x.expected=snapshot(editing)}$('saveBtn').disabled=true;google.script.run.withSuccessHandler(r=>{ $('saveBtn').disabled=false;closeForm();status(r.message,'ok');load()}).withFailureHandler(err=>{$('saveBtn').disabled=false;alert('บันทึกไม่สำเร็จ: '+msg(err))}).saveScheduleItem(x)}
function openManager(){$('formModal').classList.add('hidden');$('managerModal').classList.remove('hidden');renderManager()}function closeManager(){$('managerModal').classList.add('hidden')}
function renderManager(){const list=$('managerList');list.replaceChildren();const rows=items.filter(x=>x.date===$('datePicker').value).sort((a,b)=>(a.time||'9999').localeCompare(b.time||'9999')||a.rowNumber-b.rowNumber);if(!rows.length){const p=document.createElement('p');p.textContent='ไม่มีภารกิจในวันที่เลือก';list.append(p);return}rows.forEach(x=>{const card=document.createElement('div');card.className='manage-item';const info=document.createElement('div');info.className='manage-text';const title=document.createElement('b');title.textContent=(x.time?digits(x.time.slice(0,2)+':'+x.time.slice(2,4))+' — ':'')+(x.mission||'(ไม่มีชื่อภารกิจ)');const meta=document.createElement('div');meta.className='meta';meta.textContent='ประธาน: '+(x.chair||'-')+' | สถานที่: '+(x.location||'-');info.append(title,meta);const actions=document.createElement('div');actions.className='manage-actions';const edit=document.createElement('button');edit.className='secondary small';edit.textContent='แก้ไข';edit.onclick=()=>openForm(x);const del=document.createElement('button');del.className='danger small';del.textContent='ลบ';del.onclick=()=>remove(x);actions.append(edit,del);card.append(info,actions);list.append(card)})}
function remove(x){if(!confirm('ยืนยันลบภารกิจนี้ใช่หรือไม่?\n'+x.mission+'\nการลบไม่สามารถย้อนกลับได้'))return;google.script.run.withSuccessHandler(r=>{status(r.message,'ok');load();setTimeout(renderManager,400)}).withFailureHandler(e=>{alert('ลบไม่สำเร็จ: '+msg(e));load()}).deleteScheduleItem(x.rowNumber,snapshot(x))}
function exportPng(){if(!window.html2canvas){alert('โหลดเครื่องมือส่งออกภาพไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');return}status('กำลังสร้างภาพ PNG...');html2canvas($('exportArea'),{scale:2,backgroundColor:'#fffdf9',useCORS:true,scrollX:0,scrollY:0}).then(c=>{const a=document.createElement('a');a.download='ตารางกำหนดการ-'+($('datePicker').value||'schedule')+'.png';a.href=c.toDataURL('image/png');a.click();status('ส่งออกภาพ PNG เรียบร้อย','ok')}).catch(e=>status('ส่งออกภาพไม่สำเร็จ: '+msg(e),'error'))}
function thaiDate(iso){const p=iso.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),wd=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],mo=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];return 'ประจำวัน'+wd[d.getDay()]+' ที่ '+digits(d.getDate())+' '+mo[d.getMonth()]+' พ.ศ. '+digits(d.getFullYear()+543)}
function digits(v){return String(v).replace(/[0-9]/g,n=>'๐๑๒๓๔๕๖๗๘๙'[+n])}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function msg(e){return e&&e.message?e.message:String(e||'เกิดข้อผิดพลาด')}
</script></body></html>
